name: Global State proof 012 logical time evidence

on:
  pull_request:
    paths:
      - "src/logical-time-evidence.mjs"
      - "tests/logical-time-evidence-selftest.mjs"
      - "src/temporal-state-kernel.mjs"
      - "docs/LOGICAL_TIME_EVIDENCE_RESEARCH_V0.md"
      - "docs/ACTION_REPORT_PROOF_012.md"
      - "package.json"
      - ".github/workflows/proof-012-logical-time-evidence.yml"
  push:
    branches: [main]
    paths:
      - "src/logical-time-evidence.mjs"
      - "tests/logical-time-evidence-selftest.mjs"
      - "src/temporal-state-kernel.mjs"
      - "package.json"
      - ".github/workflows/proof-012-logical-time-evidence.yml"

jobs:
  logical-time-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run deterministic proof suite
        run: npm test
      - name: Run Proof 011 cold elapsed-time regression
        run: npm run test:cold-time
