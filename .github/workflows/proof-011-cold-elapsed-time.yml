name: Global State proof 011 cold elapsed time

on:
  pull_request:
    paths:
      - "tests/fully-cold-elapsed-time-selftest.mjs"
      - "tests/browser-process-restart-proof.html"
      - "tests/receipt-authority-service-child.mjs"
      - "src/mutation-agreement.mjs"
      - "src/durable-receipt-history.mjs"
      - "src/temporal-state-kernel.mjs"
      - "docs/ACTION_REPORT_PROOF_011.md"
      - "package.json"
      - ".github/workflows/proof-011-cold-elapsed-time.yml"
  push:
    branches: [main]
    paths:
      - "tests/fully-cold-elapsed-time-selftest.mjs"
      - "tests/browser-process-restart-proof.html"
      - "tests/receipt-authority-service-child.mjs"
      - "src/mutation-agreement.mjs"
      - "src/durable-receipt-history.mjs"
      - "src/temporal-state-kernel.mjs"
      - "package.json"
      - ".github/workflows/proof-011-cold-elapsed-time.yml"

jobs:
  cold-elapsed-time:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run deterministic regressions
        run: npm test
      - name: Run durable authority regression
        run: npm run test:durable-authority
      - name: Run fully cold resume regression
        run: npm run test:cold-resume
      - name: Run fully cold elapsed-time proof
        run: npm run test:cold-time
