name: Global State proof 005 mutation agreement

on:
  pull_request:
    paths:
      - "src/mutation-agreement.mjs"
      - "tests/mutation-agreement-selftest.mjs"
      - "docs/MUTATION_AGREEMENT_V0.md"
      - "docs/ACTION_REPORT_PROOF_005.md"
      - "package.json"
      - ".github/workflows/proof-005-mutation-agreement.yml"
  push:
    branches: [main]
    paths:
      - "src/mutation-agreement.mjs"
      - "tests/mutation-agreement-selftest.mjs"
      - "docs/MUTATION_AGREEMENT_V0.md"
      - "docs/ACTION_REPORT_PROOF_005.md"
      - "package.json"
      - ".github/workflows/proof-005-mutation-agreement.yml"

jobs:
  mutation-agreement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run deterministic proof suite
        run: npm test
