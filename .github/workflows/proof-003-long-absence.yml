name: Global State proof 003 long absence

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/long-absence-scaling-selftest.mjs"
      - "docs/ACTION_REPORT_PROOF_003.md"
      - "package.json"
      - ".github/workflows/proof-003-long-absence.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/long-absence-scaling-selftest.mjs"
      - "docs/ACTION_REPORT_PROOF_003.md"
      - "package.json"
      - ".github/workflows/proof-003-long-absence.yml"

jobs:
  long-absence-boundary-scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run deterministic proof suite
        run: npm test
