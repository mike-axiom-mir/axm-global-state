name: Global State proof 008 browser process restart

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/browser-process-restart-proof.html"
      - "tests/browser-process-restart-continuity-selftest.mjs"
      - "tests/websocket-reconnect-receipt-sync-selftest.mjs"
      - "docs/ACTION_REPORT_PROOF_008.md"
      - "package.json"
      - ".github/workflows/proof-008-browser-process-restart.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/browser-process-restart-proof.html"
      - "tests/browser-process-restart-continuity-selftest.mjs"
      - "package.json"
      - ".github/workflows/proof-008-browser-process-restart.yml"

jobs:
  browser-process-restart-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run deterministic proofs
        run: npm test
      - name: Run WebSocket reconnect regression
        run: npm run test:websocket
      - name: Run browser process restart continuity proof
        run: npm run test:persistence
