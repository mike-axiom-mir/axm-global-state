name: Global State proof 015 interval time

on:
  pull_request:
    paths:
      - "src/logical-time-interval-evidence.mjs"
      - "src/logical-time-interval-corroboration.mjs"
      - "tests/logical-time-interval-selftest.mjs"
      - "src/logical-time-corroboration.mjs"
      - "src/logical-time-admission.mjs"
      - "src/logical-time-evidence.mjs"
      - "src/temporal-state-kernel.mjs"
      - "docs/LOGICAL_TIME_INTERVAL_EVIDENCE_V0.md"
      - "docs/ACTION_REPORT_PROOF_015.md"
      - "package.json"
      - ".github/workflows/proof-015-time-interval.yml"
  push:
    branches: [main]
    paths:
      - "src/logical-time-interval-evidence.mjs"
      - "src/logical-time-interval-corroboration.mjs"
      - "tests/logical-time-interval-selftest.mjs"
      - "src/temporal-state-kernel.mjs"
      - "package.json"
      - ".github/workflows/proof-015-time-interval.yml"

jobs:
  interval-time:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run deterministic proof suite
        run: npm test
      - name: Run exact-time evidence regression
        run: npm run test:time-evidence
      - name: Run exact-time admission regression
        run: npm run test:time-admission
      - name: Run exact-time corroboration regression
        run: npm run test:time-corroboration
      - name: Run interval time proof
        run: npm run test:time-interval
