name: Global State proof 006 browser local transport

on:
  pull_request:
    paths:
      - "tests/broadcast-channel-proof.html"
      - "tests/browser-local-receipt-transport-selftest.mjs"
      - "docs/BROWSER_LOCAL_TRANSPORT_V0.md"
      - "docs/ACTION_REPORT_PROOF_006.md"
      - "package.json"
      - ".github/workflows/proof-006-browser-local-transport.yml"
  push:
    branches: [main]
    paths:
      - "tests/broadcast-channel-proof.html"
      - "tests/browser-local-receipt-transport-selftest.mjs"
      - "docs/BROWSER_LOCAL_TRANSPORT_V0.md"
      - "docs/ACTION_REPORT_PROOF_006.md"
      - "package.json"
      - ".github/workflows/proof-006-browser-local-transport.yml"

jobs:
  browser-local-receipt-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependency
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run deterministic proofs
        run: npm test
      - name: Run browser-local transport proof
        run: npm run test:transport
