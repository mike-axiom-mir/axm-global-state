name: Global State proof 009 durable authority restart

on:
  pull_request:
    paths:
      - "src/mutation-agreement.mjs"
      - "src/durable-receipt-history.mjs"
      - "tests/receipt-authority-service-child.mjs"
      - "tests/durable-receipt-authority-restart-selftest.mjs"
      - "docs/ACTION_REPORT_PROOF_009.md"
      - "package.json"
      - ".github/workflows/proof-009-durable-authority-restart.yml"
  push:
    branches: [main]
    paths:
      - "src/mutation-agreement.mjs"
      - "src/durable-receipt-history.mjs"
      - "tests/receipt-authority-service-child.mjs"
      - "tests/durable-receipt-authority-restart-selftest.mjs"
      - "package.json"
      - ".github/workflows/proof-009-durable-authority-restart.yml"

jobs:
  durable-authority-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run deterministic regressions
        run: npm test
      - name: Run durable authority process-restart proof
        run: npm run test:durable-authority
