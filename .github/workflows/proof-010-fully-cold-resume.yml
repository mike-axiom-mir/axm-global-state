name: Global State proof 010 fully cold resume

on:
  pull_request:
    paths:
      - "tests/fully-cold-end-to-end-resume-selftest.mjs"
      - "tests/browser-process-restart-proof.html"
      - "tests/receipt-authority-service-child.mjs"
      - "src/mutation-agreement.mjs"
      - "src/durable-receipt-history.mjs"
      - "src/temporal-state-kernel.mjs"
      - "docs/ACTION_REPORT_PROOF_010.md"
      - "package.json"
      - ".github/workflows/proof-010-fully-cold-resume.yml"
  push:
    branches: [main]
    paths:
      - "tests/fully-cold-end-to-end-resume-selftest.mjs"
      - "tests/browser-process-restart-proof.html"
      - "tests/receipt-authority-service-child.mjs"
      - "src/mutation-agreement.mjs"
      - "src/durable-receipt-history.mjs"
      - "src/temporal-state-kernel.mjs"
      - "package.json"
      - ".github/workflows/proof-010-fully-cold-resume.yml"

jobs:
  fully-cold-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run deterministic regressions
        run: npm test
      - name: Run durable authority regression
        run: npm run test:durable-authority
      - name: Run browser restart regression
        run: npm run test:persistence
      - name: Run fully cold end-to-end resume proof
        run: npm run test:cold-resume
