name: Global State proof 002 portability

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "docs/PORTABLE_STATE_CONTRACT_V0.md"
      - "docs/ACTION_REPORT_PROOF_002.md"
      - "package.json"
      - ".github/workflows/proof-002-portability.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "docs/PORTABLE_STATE_CONTRACT_V0.md"
      - "docs/ACTION_REPORT_PROOF_002.md"
      - "package.json"
      - ".github/workflows/proof-002-portability.yml"

jobs:
  node-chromium-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependency
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Node proofs
        run: npm test
      - name: Run Chromium portability proof
        run: npm run test:browser
