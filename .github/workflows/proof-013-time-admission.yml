name: Global State proof 013 time admission

on:
  pull_request:
    paths:
      - "src/logical-time-admission.mjs"
      - "src/logical-time-evidence.mjs"
      - "tests/logical-time-admission-selftest.mjs"
      - "tests/logical-time-evidence-selftest.mjs"
      - "src/temporal-state-kernel.mjs"
      - "docs/LOGICAL_TIME_ADMISSION_POLICY_V0.md"
      - "docs/ACTION_REPORT_PROOF_013.md"
      - "package.json"
      - ".github/workflows/proof-013-time-admission.yml"
  push:
    branches: [main]
    paths:
      - "src/logical-time-admission.mjs"
      - "src/logical-time-evidence.mjs"
      - "tests/logical-time-admission-selftest.mjs"
      - "tests/logical-time-evidence-selftest.mjs"
      - "src/temporal-state-kernel.mjs"
      - "package.json"
      - ".github/workflows/proof-013-time-admission.yml"

jobs:
  time-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run deterministic proof suite
        run: npm test
      - name: Run logical-time evidence regression
        run: npm run test:time-evidence
      - name: Run logical-time admission proof
        run: npm run test:time-admission
