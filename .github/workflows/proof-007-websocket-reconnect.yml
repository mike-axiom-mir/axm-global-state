name: Global State proof 007 WebSocket reconnect

on:
  pull_request:
    paths:
      - "tests/websocket-reconnect-proof.html"
      - "tests/websocket-reconnect-receipt-sync-selftest.mjs"
      - "docs/WEBSOCKET_RECONNECT_V0.md"
      - "docs/ACTION_REPORT_PROOF_007.md"
      - "package.json"
      - ".github/workflows/proof-007-websocket-reconnect.yml"
  push:
    branches: [main]
    paths:
      - "tests/websocket-reconnect-proof.html"
      - "tests/websocket-reconnect-receipt-sync-selftest.mjs"
      - "docs/WEBSOCKET_RECONNECT_V0.md"
      - "docs/ACTION_REPORT_PROOF_007.md"
      - "package.json"
      - ".github/workflows/proof-007-websocket-reconnect.yml"

jobs:
  websocket-reconnect-receipt-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run deterministic proofs
        run: npm test
      - name: Run WebSocket reconnect proof
        run: npm run test:websocket
